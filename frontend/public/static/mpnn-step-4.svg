<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="t d">
  <title id="t">Step 4 repeat in next layer</title>
  <desc id="d">All nodes update together; deeper layers expand receptive field.</desc>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4ade80"/>
    </marker>
  </defs>

  <g fill="#cfcfcf" font-family="Segoe UI,Tahoma,sans-serif" font-size="18" text-anchor="middle">
    <text x="200" y="52">Layer t</text>
    <text x="480" y="52">Layer t+1</text>
  </g>

  <g stroke="#6f6f6f" stroke-width="2.5" fill="none">
    <line x1="200" y1="200" x2="130" y2="120"/>
    <line x1="200" y1="200" x2="270" y2="120"/>
    <line x1="200" y1="200" x2="120" y2="280"/>
    <line x1="200" y1="200" x2="280" y2="280"/>

    <line x1="480" y1="200" x2="410" y2="120"/>
    <line x1="480" y1="200" x2="550" y2="120"/>
    <line x1="480" y1="200" x2="400" y2="280"/>
    <line x1="480" y1="200" x2="560" y2="280"/>
  </g>

  <g fill="#333" stroke="#cfcfcf" stroke-width="2">
    <circle cx="200" cy="200" r="40" fill="#3f6f8f"/>
    <circle cx="130" cy="120" r="22"/>
    <circle cx="270" cy="120" r="22"/>
    <circle cx="120" cy="280" r="22"/>
    <circle cx="280" cy="280" r="22"/>

    <circle cx="480" cy="200" r="40" fill="#3f6f8f"/>
    <circle cx="410" cy="120" r="22"/>
    <circle cx="550" cy="120" r="22"/>
    <circle cx="400" cy="280" r="22"/>
    <circle cx="560" cy="280" r="22"/>
  </g>

  <g stroke="#4ade80" stroke-width="4" marker-end="url(#a)">
    <line x1="245" y1="200" x2="435" y2="200"/>
  </g>

  <g fill="#ffffff" font-family="Segoe UI,Tahoma,sans-serif" text-anchor="middle">
    <!-- Layer t values -->
    <text x="200" y="196" font-size="18" font-weight="700">v</text>
    <text x="200" y="218" font-size="16">0.30</text>
    <text x="130" y="126" font-size="13">0.25</text>
    <text x="270" y="126" font-size="13">0.10</text>
    <text x="120" y="286" font-size="13">0.40</text>
    <text x="280" y="286" font-size="13">0.05</text>

    <!-- Layer t+1 values -->
    <text x="480" y="196" font-size="18" font-weight="700">v</text>
    <text x="480" y="218" font-size="16">0.57</text>
    <text x="410" y="126" font-size="13">0.44</text>
    <text x="550" y="126" font-size="13">0.19</text>
    <text x="400" y="286" font-size="13">0.62</text>
    <text x="560" y="286" font-size="13">0.28</text>
  </g>
</svg>
